<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>대국 중 · Cloud Chess</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico?v=20260816">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png?v=20260816">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180x180.png?v=20260816">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chess.css', v='20260816.4') }}">
</head>
<body class="chess-page chess-game-page">
    <main class="chess-game-shell" data-game-id="{{ game_id }}" data-current-user-id="{{ session.get('user_id', '') }}">
        <header class="chess-game-header">
            <a class="chess-back-link" href="/chess"><i class="fa-solid fa-chevron-left"></i> 로비</a>
            <!-- 레퍼런스 상단 중앙의 "nickben vs Shuu" 대전 타이틀 -->
            <div id="cc-match-title" class="cc-match-title">대국을 불러오는 중…</div>
            <div class="chess-header-actions">
                <div id="room-code" class="room-code"></div>
                <button id="flip-board" type="button" class="chess-header-btn" title="보드 뒤집기" aria-label="보드 뒤집기"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </header>

        <section class="chess-game-layout">
            <section class="chess-board-area">
                <!-- 좌표 라벨(랭크 8→1, 파일 a→h)은 보드 뒤집기에 따라 JS가 다시 그린다. -->
                <div class="cc-board-wrap">
                    <div id="cc-ranks" class="cc-coords cc-ranks" aria-hidden="true"></div>
                    <div id="chess-board" class="chess-board" role="grid" aria-label="체스판"></div>
                    <div id="cc-files" class="cc-coords cc-files" aria-hidden="true"></div>
                </div>
                <div id="promotion-dialog" class="promotion-dialog" hidden><p>프로모션 기물을 선택하세요</p><div><button data-promotion="q">♕</button><button data-promotion="r">♖</button><button data-promotion="b">♗</button><button data-promotion="n">♘</button></div></div>
            </section>

            <aside class="chess-side-panel">
                <!-- 상대 플레이어 카드 (레퍼런스: 우측 패널 최상단, 그린) -->
                <button type="button" class="cc-player-card cc-player-opponent chess-player-trigger" data-player-slot="opponent">
                    <img id="black-avatar" class="cc-player-avatar" src="/static/default_profile.png" alt="">
                    <span class="cc-player-meta">
                        <strong id="black-name">상대</strong>
                        <small id="black-rating" class="chess-rating">RATING 400</small>
                    </span>
                    <span id="black-clock" class="chess-clock">∞</span>
                </button>
                <div id="black-captured" class="captured-pieces"></div>

                <div class="side-title cc-moves-title"><span>기보</span></div>
                <ol id="move-history" class="move-history"></ol>

                <div class="game-actions">
                    <button id="invite-friend-btn" class="chess-secondary" type="button" hidden><i class="fa-solid fa-user-plus"></i> 친구 초대</button>
                    <button id="draw-btn" class="chess-secondary">무승부 제안</button>
                    <button id="resign-btn" class="danger-button">기권</button>
                </div>

                <div id="white-captured" class="captured-pieces"></div>
                <!-- 내 플레이어 카드 (레퍼런스: 우측 패널 최하단, 퍼플) -->
                <button type="button" class="cc-player-card cc-player-me chess-player-trigger" data-player-slot="me">
                    <img id="white-avatar" class="cc-player-avatar" src="/static/default_profile.png" alt="">
                    <span class="cc-player-meta">
                        <strong id="white-name">나</strong>
                        <small id="white-rating" class="chess-rating">RATING 400</small>
                    </span>
                    <span id="white-clock" class="chess-clock">∞</span>
                </button>

                <section class="chess-game-chat">
                    <div class="side-title"><span>실시간 채팅</span></div>
                    <div id="chess-chat-list" class="chess-chat-list"></div>
                    <form id="chess-chat-form"><input id="chess-chat-input" maxlength="200" placeholder="메시지 입력"><button class="chess-primary" aria-label="채팅 전송"><i class="fa-solid fa-paper-plane"></i></button></form>
                    <div id="chess-emote-tray" class="chess-emote-tray"><button data-emote="respect" title="리스펙">👏</button><button data-emote="goodgame" title="좋은 경기">🤝</button><button data-emote="crown" title="잘했어요">👑</button><button data-emote="taunt" title="도발">😈</button><button data-emote="smirk" title="도발">😏</button><button data-emote="laugh" title="도발">😂</button></div>
                </section>
            </aside>
        </section>
    </main>

    <!-- 레퍼런스 하단 중앙의 "SHUU'S TURN" 상태 알약 -->
    <div id="game-status" class="game-status">게임을 불러오는 중…</div>

    <div id="game-result-modal" class="game-result-modal" hidden><div><i class="fa-solid fa-trophy"></i><h2 id="result-title">게임 종료</h2><p id="result-description"></p><div class="game-result-actions"><a class="chess-secondary" href="/chess">로비로 돌아가기</a><a class="chess-primary" href="/chess">다시 플레이</a><button id="result-delete-history" class="danger-button" type="button"><i class="fa-solid fa-trash"></i> 전적 삭제</button></div></div></div>
    <div id="chess-invite-modal" class="game-result-modal" hidden><div class="chess-invite-modal-box"><button id="close-chess-invite" class="chess-modal-close" type="button" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button><i class="fa-solid fa-chess-knight"></i><h2>친구 초대</h2><p>초대는 상대의 메시지함으로 전달됩니다.</p><div id="chess-invite-friends" class="chess-invite-friends">친구 목록을 불러오는 중…</div></div></div>
    <div id="chess-player-modal" class="game-result-modal" hidden><div class="chess-player-modal-box"><button id="close-chess-player" class="chess-modal-close" type="button" aria-label="닫기"><i class="fa-solid fa-xmark"></i></button><img id="chess-player-avatar" src="/static/default_profile.png" alt=""><h2 id="chess-player-name">플레이어</h2><p id="chess-player-username"></p><div class="chess-player-stats"><span>레이팅 <strong id="chess-player-rating">400</strong></span><span>전적 <strong id="chess-player-record">0승 0무 0패</strong></span></div></div></div>
    <div id="chess-emote-pop" class="chess-emote-pop" hidden></div>

    <script src="{{ url_for('static', filename='js/chess_game.js', v='20260816.4') }}"></script>
</body>
</html>
