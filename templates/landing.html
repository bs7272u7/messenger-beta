<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Chatting</title>

  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Font Awesome: 필요한 경우에만 사용 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    :root {
      --primary: #4a90e2;
      --primary-dark: #2f72c4;
      --text: #172033;
      --muted: #687386;
      --line: #e8edf5;
      --surface: #ffffff;
      --soft-blue: #f4f8ff;
      --gradient: linear-gradient(135deg, #4a90e2 0%, #78b8ff 100%);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--surface);
      font-family: Inter, "Noto Sans KR", sans-serif;
    }

    .landing-header {
      height: 76px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      color: var(--text);
      font-size: 18px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
    }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-link,
    .button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-link {
      color: var(--text);
      background: transparent;
    }

    .button-primary {
      color: white;
      background: var(--gradient);
      box-shadow: 0 10px 24px rgba(74, 144, 226, .24);
    }

    .button-secondary {
      color: var(--text);
      background: #f1f4f8;
    }

    .brand:focus-visible,
    .nav-link:focus-visible,
    .button:focus-visible {
      outline: 3px solid rgba(74, 144, 226, .45);
      outline-offset: 3px;
    }

    .hero {
      min-height: calc(100vh - 76px);
      max-width: 1120px;
      margin: 0 auto;
      padding: 72px 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: center;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(44px, 6vw, 76px);
      line-height: 1.05;
      letter-spacing: -0.06em;
    }

    .hero h1 span {
      color: var(--primary);
    }

    .hero p {
      max-width: 480px;
      margin: 24px 0 32px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-art {
      min-height: 390px;
      border: 1px solid var(--line);
      border-radius: 32px;
      background:
        radial-gradient(circle at 80% 15%, #cfe6ff 0, transparent 30%),
        radial-gradient(circle at 15% 85%, #e6f1ff 0, transparent 35%),
        var(--soft-blue);
      display: grid;
      place-items: center;
    }

    .cloud-card {
      width: min(80%, 330px);
      padding: 28px;
      border-radius: 24px;
      color: white;
      background: var(--gradient);
      box-shadow: 0 24px 50px rgba(74, 144, 226, .3);
      text-align: center;
    }

    .cloud-card i {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
    }

    @media (max-width: 760px) {
      .landing-header { padding: 0 20px; }
      .nav-link { display: none; }
      .hero {
        grid-template-columns: 1fr;
        padding: 42px 20px;
        gap: 38px;
      }
      .hero-art { min-height: 260px; }
      .button { min-height: 46px; display: inline-flex; align-items: center; justify-content: center; }
    }
  </style>
</head>

<body>
  <header class="landing-header">
    <a class="brand" href="/">
      <img src="{{ url_for('static', filename='favicon-180x180.png') }}" alt="">
      <span>Cloud Chatting</span>
    </a>

    <nav class="nav">
      <a class="nav-link" href="#about">소개</a>
      <a class="nav-link" href="/login">로그인</a>
      <a class="button button-primary" href="/login?mode=register">가입하기</a>
    </nav>
  </header>

  <main class="hero">
    <section>
      <h1>가볍게 연결되는<br><span>Cloud Chatting</span></h1>

      <!-- 랜딩 문구를 정하면 이 문장만 교체하시면 됩니다. -->
      <p>언제 어디서나, 소중한 사람들과 편안하게 대화를 이어가세요.</p>

      <div class="hero-actions">
        <a class="button button-primary" href="/login?mode=register">
          Cloud Chatting에 가입하기
        </a>
        <a class="button button-secondary" href="/login">
          이미 계정이 있습니다
        </a>
      </div>
    </section>

    <aside class="hero-art" aria-hidden="true">
      <div class="cloud-card">
        <i data-lucide="cloud"></i>
        <strong>Cloud Chatting</strong>
        <p>대화가 자연스럽게 이어지는 공간</p>
      </div>
    </aside>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
