<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>체스 대국 초대 · Cloud Chatting</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/chess-favicon-knight.ico', v='20260815') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chess.css') }}">
</head>
<body class="chess-page">
    <main class="chess-invite-page"><section class="chess-settings-card"><h1>체스 대국 초대</h1><p id="invite-status">대국 정보를 확인하는 중…</p></section></main>
    <script>
        (async () => {
            const response = await fetch("/api/chess/invites/{{ invite_id }}/accept", {method:"POST", headers:{"X-CSRF-Token":document.querySelector('meta[name="csrf-token"]').content}});
            const data = await response.json();
            if (response.ok && data.success) location.replace(`/chess/game/${data.game.id}`);
            else document.querySelector("#invite-status").textContent = data.error || "초대를 수락하지 못했습니다.";
        })();
    </script>
</body>
</html>
